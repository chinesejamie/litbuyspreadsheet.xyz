# HTTP → HTTPS redirect (port 80 for all variants)
server {
    listen 80;
    server_name litbuyspreadsheet.xyz www.litbuyspreadsheet.xyz;
    return 301 https://litbuyspreadsheet.xyz$request_uri;
}

# www → non-www redirect (HTTPS)
server {
    listen 443 ssl;
    server_name www.litbuyspreadsheet.xyz;

    ssl_certificate     /etc/letsencrypt/live/litbuyspreadsheet.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/litbuyspreadsheet.xyz/privkey.pem;

    return 301 https://litbuyspreadsheet.xyz$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name litbuyspreadsheet.xyz;

    ssl_certificate     /etc/letsencrypt/live/litbuyspreadsheet.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/litbuyspreadsheet.xyz/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
